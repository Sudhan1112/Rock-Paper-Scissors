<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<body>
    <div id="Main_box">
        <p class="p1">Rock Paper Scissor</p>
        <p class="p2">Computer Choice: <span class="P2"></span></p>
        <p class="p3">Your Choice: <span class="P3"></span></p>
        <div>
            <button id="rock">
                Rock
            </button>
            <button id="paper">
                Paper
            </button>
            <button id="scissor">
                Scissor
            </button>
        </div>
        <div>RESULT: <span id="result"></span></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
